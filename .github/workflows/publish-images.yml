name: Publish Multi-Architecture Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: phantomx-puzzle-motion
            dockerfile: docker/motion.Dockerfile
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - image: phantomx-puzzle-motion
            dockerfile: docker/motion.Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          - image: phantomx-puzzle-vision
            dockerfile: docker/vision.Dockerfile
            platform: linux/amd64
            runner: ubuntu-22.04
            suffix: amd64
          - image: phantomx-puzzle-vision
            dockerfile: docker/vision.Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}-${{ matrix.suffix }}
          provenance: false
          sbom: false

  merge:
    name: Merge ${{ matrix.image }} manifest
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - phantomx-puzzle-motion
          - phantomx-puzzle-vision
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-architecture manifest and record digest
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          target="ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker buildx imagetools create \
            --tag "${target}" \
            --metadata-file metadata.json \
            "${target}-amd64" \
            "${target}-arm64"
          digest="$(jq -r '."containerimage.descriptor".digest' metadata.json)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid manifest digest: ${digest}" >&2
            exit 1
          fi
          mkdir -p release-digests
          printf '%s@%s\n' "${target%:${GITHUB_REF_NAME}}" "${digest}" \
            > "release-digests/${IMAGE_NAME}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}-digest
          path: release-digests/*.txt

  release-env:
    needs: merge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phantomx-puzzle-*-digest
          path: release-digests
          merge-multiple: true
      - name: Create immutable deployment environment
        shell: bash
        run: |
          echo "MOTION_IMAGE=$(cat release-digests/phantomx-puzzle-motion.txt)" > release.env
          echo "VISION_IMAGE=$(cat release-digests/phantomx-puzzle-vision.txt)" >> release.env
          echo "RELEASE_MODE=1" >> release.env
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-release-env-${{ github.ref_name }}
          path: release.env
