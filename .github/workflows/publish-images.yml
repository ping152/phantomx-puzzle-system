name: Publish Multi-Architecture Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: phantomx-puzzle-motion
            dockerfile: docker/motion.Dockerfile
          - name: phantomx-puzzle-vision
            dockerfile: docker/vision.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Record immutable digest
        shell: bash
        run: |
          mkdir -p release-digests
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}" > "release-digests/${{ matrix.image.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image.name }}-digest
          path: release-digests/*.txt

  release-env:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: phantomx-puzzle-*-digest
          path: release-digests
          merge-multiple: true
      - name: Create immutable deployment environment
        shell: bash
        run: |
          echo "MOTION_IMAGE=$(cat release-digests/phantomx-puzzle-motion.txt)" > release.env
          echo "VISION_IMAGE=$(cat release-digests/phantomx-puzzle-vision.txt)" >> release.env
          echo "RELEASE_MODE=1" >> release.env
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-release-env-${{ github.ref_name }}
          path: release.env
